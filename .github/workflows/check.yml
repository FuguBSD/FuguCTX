name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup uv
        uses: FuguBSD/Tooling/python/actions/setup-uv@main

      # The format gate runs prettier through bunx.
      - name: Setup bun
        uses: FuguBSD/Tooling/actions/setup-bun@main

      # make deps installs the tool environment before the runtime
      # one, so the secret gate has its binary. One pin serves the
      # operator gate and the CI gate.
      - name: Install dependencies
        run: |
          make deps
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # make check runs the gitleaks gate, and the gate scans the
      # full git history, so the checkout above stays at fetch-depth
      # 0 (WFL-GITLEAKS-2). The manifest provides the binary.
      - name: Check
        run: make check

      - name: Drift gate
        if: github.event_name == 'pull_request'
        run: scripts/spec-check --drift "origin/${{ github.base_ref }}"

  sync:
    name: Sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout FuguBSD/Tooling
        uses: actions/checkout@v4
        with:
          repository: FuguBSD/Tooling
          path: tooling

      # The synced copies must match FuguBSD/Tooling exactly.
      - name: Verify the synced copies
        run: ./tooling/scripts/sync --check
